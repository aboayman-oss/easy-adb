name: Release

# Push a tag like v1.2.3 (matching "version" in package.json) to build the Windows
# installer and portable zip and publish them as a GitHub release.
# Running it by hand builds the files and keeps them as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - name: Typecheck, test and build
        run: npm run verify

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Build portable zip
        run: npm run pack:portable

      - name: Keep the files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easy-adb-windows
          path: |
            dist/Easy-ADB-Setup-*.exe
            dist/Easy-ADB-Portable-*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/Easy-ADB-Setup-*.exe \
            dist/Easy-ADB-Portable-*.zip \
            --title "Easy ADB ${GITHUB_REF_NAME#v}" \
            "${notes_args[@]}"
